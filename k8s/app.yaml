apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-platform }
  template:
    metadata:
      labels: { app: order-platform }
    spec:
      containers:
        - name: app
          image: your-dockerhub-user/order-platform:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-platform
spec:
  type: LoadBalancer
  selector: {app: order-platform}
  ports:
    - port: 80
      targetPort: 8080
